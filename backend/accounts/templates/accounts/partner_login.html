<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CampusOS Partner Login</title>
<style>body{font-family:system-ui;background:#171324;color:#f5efff;min-height:100vh;display:grid;place-items:center;margin:0}main{background:#28213b;padding:32px;border-radius:22px;width:min(90%,400px)}input,button{display:block;box-sizing:border-box;width:100%;padding:14px;margin:12px 0;border-radius:12px}button{background:#c5a5ff;border:0;font-weight:700}input{background:#eee;border:0}.error{color:#ffb0a7}</style>
</head><body><main><h1>CampusOS 💜</h1><p>University TV Partner Portal</p>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">{% csrf_token %}<label>Email<input type="email" name="email" required autocomplete="username"></label>
<label>Password<input type="password" name="password" required autocomplete="current-password"></label>
<button type="submit">Sign in</button></form><small>Ask the CampusOS administrator to activate your partner account.</small></main></body></html>
